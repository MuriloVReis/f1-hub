<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="container">

            <div class="logo">
                <a href="#">
                    <img
                        src="assets/logos/f1-logo.png"
                        alt="F1"
                    >
                    <span>HUB</span>
                </a>
            </div>

            <nav class="navbar">
                <a href="#" class="active">Início</a>
                <a href="#">Pilotos</a>
                <a href="#">Equipes</a>
                <a href="#">Ranking</a>
                <a href="#">Estatísticas</a>
                <a href="#">Notícias</a>
            </nav>

            <div class="header-actions">
                <button class="search-button" aria-label="Pesquisar">
                    <img src="assets/icons/search.svg" alt="">
                </button>

                <button class="login-button">
                    Entrar
                </button>
            </div>

        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">

                <div class="hero-content">

                    <div class="hero-text">

                        <h1>
                            O MUNDO DA
                            <span>FÓRMULA 1</span>
                        </h1>

                        <p>
                            Explore pilotos, equipes, estatísticas
                            e fique por dentro de tudo que acontece
                            na principal categoria do automobilismo.
                        </p>

                        <a href="#" class="btn-primary">
                            EXPLORAR PILOTOS →
                        </a>

                    </div>

                    <div class="hero-image"></div>

                </div>

                <div class="search-box">

                    <input
                        type="text"
                        placeholder="Pesquisar piloto, equipe ou corrida..."
                    >

                    <button>
                        BUSCAR
                    </button>

                </div>

            </div>
        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
